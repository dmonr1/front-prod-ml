@if (rendered()) {
  <div class="custom-alert-backdrop" [class.is-closing]="closing()" (click)="onClose()">
    <div class="custom-alert-card" [class.is-closing]="closing()" (click)="$event.stopPropagation()">
      <button class="custom-alert-close" type="button" aria-label="Cerrar alerta" (click)="onClose()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="custom-alert-icon" [class]="type()">
        <i [class]="iconClass()"></i>
      </div>

      <div class="custom-alert-copy">
        <strong>{{ title() }}</strong>
        <p>{{ displayMessage() }}</p>
      </div>

      @if (hasActions()) {
        <div class="custom-alert-actions">
          @if (cancelText()) {
            <button class="custom-alert-button secondary" type="button" (click)="cancel.emit()">
              {{ cancelText() }}
            </button>
          }

          @if (effectiveConfirmText()) {
            <button class="custom-alert-button primary" type="button" (click)="onConfirm()">
              {{ effectiveConfirmText() }}
            </button>
          }
        </div>
      }
    </div>
  </div>
}
